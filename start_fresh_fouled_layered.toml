# 420 MHz: Clean ballast + thin fouled top layer (generates coda structure)
[job]
render = true

[sim]
freq_hz = 420e6
domain_x = 0.5
dx = 0.003
antenna_clearance = 0.3
air_buffer = 0.0
time_window = 5.0e-8
antenna_mode = "bistatic"
num_receivers = 1
receiver_spacing = 0.03
title = "420 MHz Clean + Fouled Top Layer (spike generation)"

[source]
waveform = "gaussian"
amplitude = 0.3
polarization = "z"

# Bottom layer: Clean ballast (main signal)
[[layer]]
name = "ballast_clean"
thickness = 0.25
eps = 5.1
sigma = 0.0

# Top layer: Fouled ballast (fines = higher epsilon)
# This creates a scattering interface that generates coda spikes
[[layer]]
name = "fouling_layer"
thickness = 0.05
eps = 8.5
sigma = 0.0
