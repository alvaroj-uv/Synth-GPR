# Baseline Configuration (No Domain Randomization)
# Used for comparison tests

[simulation]
domain_x = 0.5
domain_y = 1.5
domain_z = 0.005
dx = 0.005
dy = 0.005
dz = 0.005
time_window = 1.5e-8

[antenna]
center_freq = 1.5e9
tx_x = 0.300
rx_x = 0.350
tx_rx_y = 1.28
tx_rx_z = 0.0025

[ballast]
min_ballast_thickness = 0.25
max_ballast_thickness = 0.45
rock_radius_min = 0.02
rock_radius_max = 0.032

[materials]
bal_rock_eps = 5.0
bal_rock_sigma = 0.001

[layers]
formation_thickness = 0.10
subgrade_thickness = 0.20

[Granular]
granular_mode = true
pvc_min = 20.0
pvc_max = 40.0

[Moisture]
moisture_max = 0.15

[domain_randomization]
# Randomization OFF for baseline
enable_domain_randomization = false

[workflow]
output_dir = d:/Codigo/Synth-Data/Tests/RandomizationTest/Baseline
labels = MF
samples_per_label = 1
start_id = 30000
