# Quick Test Configuration
# Minimal config for fast validation

[simulation]
domain_x = 0.5
domain_y = 1.5
domain_z = 0.005
dx = 0.005
dy = 0.005
dz = 0.005
time_window = 1.5e-8

[antenna]
center_freq = 1.5e9
tx_x = 0.300
rx_x = 0.350
tx_rx_y = 1.28
tx_rx_z = 0.0025

[ballast]
# Constraint: Top of rocks must be at least 50cm below antenna (y=1.28)
# Max rock top = subgrade(0.2) + formation(0.1) + ballast + rock_radius
# 0.2 + 0.1 + 0.40 + 0.032 = 0.732m < 0.78m ✓
min_ballast_thickness = 0.25
max_ballast_thickness = 0.40
rock_radius_min = 0.02
rock_radius_max = 0.032

[materials]
bal_rock_eps = 5.0
bal_rock_sigma = 0.001

[layers]
formation_thickness = 0.10
subgrade_thickness = 0.20

[Granular]
granular_mode = true
pvc_min = 0.0
pvc_max = 50.0

[Moisture]
moisture_max = 0.30

[workflow]
# Quick test: 5 samples, 1 per label type (CL, MC, M, MF, HF)
output_dir = d:/Codigo/Synth-Data/Tests/QuickTest
labels = CL,MC,M,MF,HF
samples_per_label = 1
start_id = 50000
# Generate antenna-shifted variants (_L, _R) for each sample
generate_antenna_variants = true
antenna_shift_amount = 0.05

