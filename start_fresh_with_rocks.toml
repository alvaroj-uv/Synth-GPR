# 420 MHz Clean Ballast WITH ROCKS (generates coda spikes)
[job]
render = true

[sim]
freq_hz = 420e6
domain_x = 0.5
dx = 0.003
antenna_clearance = 0.3
air_buffer = 0.0
time_window = 5.0e-8
antenna_mode = "bistatic"
num_receivers = 1
receiver_spacing = 0.03
title = "420 MHz Clean Ballast with Rock Scattering"

[source]
waveform = "gaussian"
amplitude = 0.3
polarization = "z"

[[layer]]
name = "ballast_clean"
thickness = 0.3
eps = 5.1
sigma = 0.0

[granular]
# Rock packing parameters to generate scattering (coda spikes)
rock_packing_algorithm = "mbubia_ballast"  # Physics-based dense packing
rock_radius_min = 0.012  # 12 mm min
rock_radius_max = 0.032  # 32 mm max (typical ballast grain size)
rock_layers = 3
rock_packing_target_fill = 0.65  # 65% fill (typical ballast porosity ~35%)
rock_packing_max_attempts = 2000
rock_min_gap = 0.0
angular_rocks = false
rock_gravity_settle = true
antenna_rock_clearance = 0.02
