[Geometry]
domain_x = 0.5
domain_y = 1.0
domain_z = 0.005
dx = 0.005
dy = 0.005
dz = 0.005
subgrade_thickness = 0.20
formation_thickness = 0.10
# Ballast depths
min_ballast_thickness = 0.25
max_ballast_thickness = 0.30
min_foul_thickness = 0.00
max_foul_thickness = 0.10

[Simulation]
time_window = 1.0e-8
center_freq = 4e8
tx_x = 0.20
rx_x = 0.25
tx_rx_y = 0.70
tx_rx_z = 0.0025
add_waveform = True
add_source = True
add_geometry_view = False
base_seed = 12345

[Granular]
# Enable granular mode?
granular_mode = True
pvc_min = 0.0
pvc_max = 50.0
rock_radius_min = 0.02
rock_radius_max = 0.05
max_pockets = 4

[Moisture]
moisture_min = 0.0
moisture_max = 0.1
fractal_dimension = 1.5

[Materials]
bal_rock_eps = 5.0
bal_rock_sigma = 0.001
bal_foul_eps_min = 6.0
bal_foul_eps_max = 8.0
bal_foul_sigma_min = 0.002
bal_foul_sigma_max = 0.01
pocket_eps_min = 7.0
pocket_eps_max = 10.0
pocket_sigma_min = 0.005
pocket_sigma_max = 0.03
wet_eps_factor_min = 1.2
wet_eps_factor_max = 1.8
wet_sigma_factor_min = 1.5
wet_sigma_factor_max = 3.0

[VerticalGradient]
grad_min_layers = 2
grad_max_layers = 5

[DatasetGeneration]
# Output directory for generated files (Test output)
output_dir = d:\Codigo\Synth-Data\Test_Output
# Labels to generate (space separated)
generate_labels = CL
# Number of base samples per label (Minimal for speed)
n_samples = 1
# Starting ID for filenames
start_id = 99999
# Enable spatial augmentation
augment = True
