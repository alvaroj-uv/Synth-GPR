[job]
mode = "layers"
output = "10layer_eps_sweep.in"

[sim]
freq_hz = 1500000000  # 1.5 GHz
antenna_mode = "bistatic"
antenna_clearance = 0.5  # 50cm clearance above layers
air_buffer = 0.1
domain_x = 0.6  # Domain size in X direction
receiver_spacing = 0.05  # 5cm receiver spacing
num_receivers = 1
rock_packing_algorithm = "mbubia_ballast"

[source]
waveform = "gaussian"
amplitude = 1.0
polarization = "z"

# 10 layers, each 5cm thick, with epsilon linearly spaced from 3 to 10
[[layer]]
name = "layer_1"
thickness = 0.05
eps = 3.0
sigma = 0.0

[[layer]]
name = "layer_2"
thickness = 0.05
eps = 3.7777777777777777
sigma = 0.0

[[layer]]
name = "layer_3"
thickness = 0.05
eps = 4.555555555555555
sigma = 0.0

[[layer]]
name = "layer_4"
thickness = 0.05
eps = 5.333333333333333
sigma = 0.0

[[layer]]
name = "layer_5"
thickness = 0.05
eps = 6.111111111111111
sigma = 0.0

[[layer]]
