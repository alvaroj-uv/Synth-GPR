[Geometry]
domain_x = 0.5
domain_y = 1.5
domain_z = 0.005
dx = 0.005
dy = 0.005
dz = 0.005
subgrade_thickness = 0.20
formation_thickness = 0.10
# Ballast depths
min_ballast_thickness = 0.25
max_ballast_thickness = 0.45
min_foul_thickness = 0.00
max_foul_thickness = 0.10

[Simulation]
time_window = 1.5e-8
center_freq = 4e8
tx_x = 0.300
rx_x = 0.35
tx_rx_y = 0.904
tx_rx_z = 0.0025
add_waveform = True
add_source = True
add_geometry_view = False
# If False, random seed is not fixed
base_seed = 
output_folder = d:\Codigo\Synth-Data\400MHz

[Granular]
# Enable granular mode?
granular_mode = True
pvc_min = 0.0
pvc_max = 100.0
rock_radius_min = 0.02
rock_radius_max = 0.05
# Max pockets (if not granular or used in other modes)
max_pockets = 4

[Moisture]
moisture_min = 0.0
moisture_max = 0.3
fractal_dimension = 1.5

[Materials]
# Dielectric properties (Relative Permittivity eps, Conductivity sigma)
# Clean Ballast
bal_rock_eps = 5.0
bal_rock_sigma = 0.001
# Fouling (Base/Legacy)
bal_foul_eps_min = 6.0
bal_foul_eps_max = 8.0
bal_foul_sigma_min = 0.002
bal_foul_sigma_max = 0.01
# Pockets
pocket_eps_min = 7.0
pocket_eps_max = 10.0
pocket_sigma_min = 0.005
pocket_sigma_max = 0.03
# Wet fouling amplification factors
wet_eps_factor_min = 1.2
wet_eps_factor_max = 1.8
wet_sigma_factor_min = 1.5
wet_sigma_factor_max = 3.0

[VerticalGradient]
grad_min_layers = 2
grad_max_layers = 5

[workflow]
# Output directory for generated files
output_dir = d:\Codigo\Synth-Data\400MHz
# Labels to generate (comma separated)
labels = CL,MC,MF,F,HF
# Number of samples per label
samples_per_label = 10
# Starting ID for filenames
start_id = 0
# Parallel jobs for simulation
num_jobs = 4

