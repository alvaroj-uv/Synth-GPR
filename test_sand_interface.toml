# Thin sand interface layer between air gap and rocks
# Models weathered/fine material at the surface
[job]
render = true

[sim]
freq_hz = 420e6
domain_x = 0.5
dx = 0.003
antenna_clearance = 0.3
air_buffer = 0.0
time_window = 5.0e-8
antenna_mode = "bistatic"
num_receivers = 1
receiver_spacing = 0.03
title = "Thin sand interface between air and rocks"

[source]
waveform = "gaussian"
amplitude = 0.3
polarization = "z"

# Layer 1: Main ballast layer (rocks) - BOTTOM
[[layer]]
name = "ballast"
thickness = 0.27
packed = true
rock_packing_algorithm = "mbubia"
rock_diameter = 0.025
rock_porosity = 0.50
eps = 7.5
sigma = 0.0001

# Layer 2: Thin sand interface (weathered surface layer) - TOP
[[layer]]
name = "sand_interface"
thickness = 0.03
packed = false
eps = 4.5
sigma = 0.0001
