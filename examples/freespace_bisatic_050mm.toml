# Bistatic antenna - TX/RX spacing 30mm
# Testing optimal spacing found via metaheuristic optimization
[sim]
freq_hz = 400e6
domain_x = 0.5
dx = 0.003
antenna_clearance = 0.1
air_buffer = 0.1
time_window = 5.0e-8
antenna_mode = "bistatic"
num_receivers = 1
receiver_spacing = 0.03
title = "Bistatic 400MHz - TX/RX 30mm (Optimized)"

[source]
waveform = "ricker"
amplitude = 1.0
polarization = "z"

[[layer]]
name = "air"
thickness = 0.5
