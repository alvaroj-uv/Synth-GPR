# DEFAULT OPTIMIZED CONFIGURATION
# ================================
# This is the recommended standard configuration for all synthetic GPR generation.
#
# CALIBRATION SETTINGS (2026-06-16; corregido 2026-07-07):
# - Waveform: Gaussian — PROVISIONAL; el "+145.6% vs Ricker" está INVALIDATED
#   (comparación de correlaciones en el suelo de ruido sobre coda-speckle)
# - Frequency: 420 MHz — provisional; el "+2.6%" está INVALIDATED (mismo motivo)
# - Antenna: Bistatic 30mm — plausible físicamente; el "+10%" está INVALIDATED
# - 88.76% = full-trace correlation (direct-wave dominated): valida
#   timing/remuestreo/polaridad, NO el matching de coda.
#   Ver docs/FINAL_CALIBRATION_SUMMARY.md y docs/specs/ALGORITHM_SPECS.md SPEC-1.
#
# USE THIS CONFIG FOR:
# - New synthetic dataset generation
# - Feature extraction validation
# - Domain adaptation research
# - Any simulation not requiring custom parameters
#
# TO OVERRIDE: Modify [sim] section or create a new TOML file
#
# REFERENCE: docs/FINAL_CALIBRATION_SUMMARY.md

[job]
render = true

[sim]
# Optimized frequency (420 MHz > nominal 400 MHz)
freq_hz = 420e6

# Standard domain size (0.5m x 0.7m x 3mm)
domain_x = 0.5
dx = 0.003

# Antenna clearance (default)
antenna_clearance = 0.1

# Air buffer above surface
air_buffer = 0.1

# Standard time window (50 ns)
time_window = 5.0e-8

# Optimized antenna geometry: bistatic with 30mm TX/RX separation
antenna_mode = "bistatic"
num_receivers = 1
receiver_spacing = 0.03

# Descriptive title
title = "DEFAULT - 420 MHz Gaussian Bistatic 30mm (Optimized)"

[source]
# Optimized waveform: Gaussian (not Ricker)
waveform = "gaussian"
amplitude = 1.0
polarization = "z"

# Free-space simulation: single air layer defines the subsurface height.
# For multi-layer scenes, list layers top → bottom (shallowest first).
# Air is the background — no need to declare it in non-freespace configs.
[[layer]]
name = "air"
thickness = 0.5
