# Single sampled .in file — TOML-only generate_in_files.py
# Run: generate_in_files.py examples/configs/single_400mhz.toml -o test.in
[job]
mode = "single"

[sim]
freq_hz                = 400e6
rock_packing_algorithm = "circlify"
rock_psd_type          = "uniform"
num_rx                 = 1
rx_spacing             = 0.05
angular                = true
sides                  = 6
seed                   = 42

[single]
pvc            = 25.0   # omit to sample randomly
moisture       = 0.10   # omit to sample randomly
render         = false
randomize_rocks = false
