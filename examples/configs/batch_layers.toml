# batch mode over an arbitrary [[layer]] stack -> N seed-varied dataset-format .in
[job]
mode = "batch"

[sim]
freq_hz                = 400e6
domain_x               = 1.0
rx_spacing             = 0.0
seed                   = 42
rock_packing_algorithm = "circlify"

[batch]
n_per_label = 3
start_id    = 8000

[[layer]]
name = "subgrade"
thickness = 0.20
eps = 9.0
sigma = 0.025

[[layer]]
name = "ballast"
thickness = 0.25
packed = true
rock_eps = 4.0
rock_sigma = 0.001
matrix = "fouling"
