# Free space 420 MHz - Gaussian bistatic 30mm spacing [PROVISIONAL]
# corregido 2026-07-07: los claims de "mejor correlación" del grid search están
# INVALIDATED — comparaban correlaciones de coda-speckle en el suelo de ruido
# (ver docs/FINAL_CALIBRATION_SUMMARY.md §1.1-1.3 y SPEC-1). Config se conserva
# como placeholder operativo sin evidencia de superioridad.
[sim]
freq_hz = 420e6
domain_x = 0.5
dx = 0.003
antenna_clearance = 0.1
air_buffer = 0.1
time_window = 5.0e-8
antenna_mode = "bistatic"
num_receivers = 1
receiver_spacing = 0.03
title = "420 MHz - Gaussian Bistatic 30mm [Optimized]"

[source]
waveform = "gaussian"
amplitude = 1.0
polarization = "z"

[[layer]]
name = "air"
thickness = 0.5
