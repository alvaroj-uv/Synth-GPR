# Free space 420 MHz - Gaussian with explicit time delay = 0
[sim]
freq_hz = 420e6
domain_x = 0.5
dx = 0.003
antenna_clearance = 0.1
air_buffer = 0.1
time_window = 5.0e-8
antenna_mode = "bistatic"
num_receivers = 1
receiver_spacing = 0.03
title = "420 MHz - Gaussian with time delay 0"

[source]
waveform = "gaussian"
amplitude = 1.0
delay = 0.0
polarization = "z"

[[layer]]
name = "air"
thickness = 0.5
