# Complete N-layer scene config for the .in creator.
# The TOML is the single source of truth; CLI flags only override [sim].
#
#   python scripts/pipeline/generate_in_files.py out.in \
#       --layers-file examples/example_layers.toml --render
#
# This whole file is embedded verbatim in the .in header for exact reproduction.

[sim]
title             = "400 MHz N-layer ballast"
freq_hz           = 400e6
domain_x          = 1.0          # scan width (m)
# dx              = 0.004        # optional; derived from freq + er_max if omitted
antenna_clearance = 0.5          # air above the surface for the antenna (m)
air_buffer        = 0.1          # extra air above the antenna (m)
rx_spacing        = 0.0          # 0 = monostatic single dipole
seed              = 42
# time_window     = 5e-8         # optional; derived if omitted

[source]                          # optional source overrides
waveform     = "ricker"
amplitude    = 1.0
polarization = "z"

# ---- layer stack, bottom -> top ----
[[layer]]
name = "subgrade"                 # PMC9003199 dry railway subgrade (eps=8)
thickness = 0.20

[[layer]]
name = "formation"                # sub-ballast / transition (eps=10)
thickness = 0.10

[[layer]]
name = "ballast"                  # clean ballast rocks (eps=4) in air voids
thickness = 0.25
packed = true
matrix = "free_space"             # clean, dry. Use "fouling" for a fouled bed.

[[layer]]
name = "clay_cap"                 # explicit material (not in the named registry)
thickness = 0.06
eps = 12.0
sigma = 0.05

# ---- optional passthrough: ANY extra gprMax command lands in the .in ----
[[command]]
raw = "#geometry_view: 0 0 0 1.0 1.21 0.004 0.004 0.004 0.004 nlayer_scene n"
