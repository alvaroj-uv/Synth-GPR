# V3 Dataset: Imbalanced high-fouling configuration
# Targets real Site-1 distribution: 75% F, 17% MF, 9% C
# (No MC/HF to match real data which only has 3 classes)

[sim]
title             = "400 MHz N-layer ballast V3 (high fouling)"
freq_hz           = 400e6
domain_x          = 1.0
antenna_clearance = 0.5
air_buffer        = 0.1
rx_spacing        = 0.0
seed              = 42

[source]
waveform     = "ricker"
amplitude    = 1.0
polarization = "z"

# ---- layer stack, bottom -> top ----
[[layer]]
name = "subgrade"
thickness = 0.20

[[layer]]
name = "formation"
thickness = 0.10

[[layer]]
name = "ballast"
thickness = 0.25
packed = true
matrix = "fouling"

[[layer]]
name = "clay_cap"
thickness = 0.06
eps = 12.0
sigma = 0.05
