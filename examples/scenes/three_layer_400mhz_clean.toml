# 400 MHz, three-layer (subgrade / formation / ballast), mbubia packing — CLEAN.
# Clean ballast = stones in air voids (matrix = free_space).
#
#   python scripts/pipeline/generate_in_files.py \
#       test_output/three_layer_400mhz_clean.in \
#       --layers-file examples/scenes/three_layer_400mhz_clean.toml --render

[sim]
title             = "400 MHz 3-layer mbubia — clean"
freq_hz           = 400e6
domain_x          = 1.0
antenna_clearance = 0.5
air_buffer        = 0.1
rx_spacing        = 0.0
seed              = 42

[scenario]
target_fouling    = "clean"
target_eps        = 4.0
target_sigma      = 0.001

[[layer]]
name = "subgrade"             # eps=8
thickness = 0.20

[[layer]]
name = "formation"            # eps=10
thickness = 0.10

[[layer]]
name = "ballast"              # mbubia-packed rocks (eps=4) ...
thickness = 0.25
packed = true
matrix = "free_space"         # ... in air voids (clean, dry)
