# TEST CONFIG — smallest valid scene: one flat named layer, no packing.
# Use as the fastest smoke test of the TOML → .in path (no rock packing, ~instant).
#
#   python scripts/pipeline/generate_in_files.py test_output/minimal.in \
#       --layers-file examples/scenes/test_minimal_single_layer.toml

[sim]
title             = "TEST minimal single layer"
freq_hz           = 400e6
domain_x          = 0.5
antenna_clearance = 0.3
air_buffer        = 0.1
rx_spacing        = 0.0          # monostatic
seed              = 1

[[layer]]
name = "subgrade"                # named material from the registry (eps=8)
thickness = 0.30
