# Per-layer property test: each layer sets name/thickness/eps/sigma; two packed
# layers use DIFFERENT rock packing algorithms.
[sim]
title                  = "per-layer control test"
freq_hz                = 400e6
domain_x               = 1.0
rx_spacing             = 0.0
seed                   = 42
rock_packing_algorithm = "circlify"   # scene default

[[layer]]
name      = "subgrade"
thickness = 0.20
eps       = 9.0
sigma     = 0.025

[[layer]]
name      = "clay_cap"
thickness = 0.10
eps       = 12.0
sigma     = 0.05

[[layer]]
name                   = "lower_ballast"
thickness              = 0.15
packed                 = true
rock_eps               = 4.0
rock_sigma             = 0.001
matrix                 = "fouling"
rock_packing_algorithm = "rsa"        # per-layer override

[[layer]]
name                   = "upper_ballast"
thickness              = 0.15
packed                 = true
rock_eps               = 4.0
rock_sigma             = 0.001
matrix                 = "free_space"
# no rock_packing_algorithm -> inherits scene default (circlify)
