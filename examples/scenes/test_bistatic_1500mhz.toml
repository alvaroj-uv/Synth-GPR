# TEST CONFIG — 1.5 GHz bistatic antenna (rx_spacing > 0), clean packed ballast.
# Covers the high-frequency + offset-receiver axis the 400 MHz examples don't.
#
#   python scripts/pipeline/generate_in_files.py test_output/bistatic_1500.in \
#       --layers-file examples/scenes/test_bistatic_1500mhz.toml

[sim]
title             = "TEST 1.5 GHz bistatic clean ballast"
freq_hz           = 1.5e9
domain_x          = 0.6
antenna_clearance = 0.3
air_buffer        = 0.1
rx_spacing        = 0.05         # 5 cm TX-RX offset -> bistatic
seed              = 11

[scenario]
target_fouling = "clean"

[[layer]]
name = "subgrade"
thickness = 0.20

[[layer]]
name = "formation"
thickness = 0.10

[[layer]]
name = "ballast"                 # rocks (eps=4) in air voids = clean dry bed
thickness = 0.25
packed = true
matrix = "free_space"
