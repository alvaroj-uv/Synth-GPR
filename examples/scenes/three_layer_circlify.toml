# 400 MHz, three-layer mbubia — CIRCLIFY packing
[sim]
title             = "400 MHz 3-layer mbubia circlify — fouled"
freq_hz           = 400e6
domain_x          = 1.0
antenna_clearance = 0.5
air_buffer        = 0.1
rx_spacing        = 0.0
seed              = 42
rock_packing_algorithm = "circlify"

[source]
waveform     = "ricker"
amplitude    = 1.0
polarization = "z"

[scenario]
target_fouling    = "fouled"
target_eps        = 5.0
target_sigma      = 0.005

[[layer]]
name = "subgrade"
thickness = 0.20

[[layer]]
name = "formation"
thickness = 0.10

[[layer]]
name = "ballast"
thickness = 0.25
packed = true
matrix = "fouling"
