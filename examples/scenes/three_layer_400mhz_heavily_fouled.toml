# 400 MHz, three-layer (subgrade / formation / ballast), mbubia packing — HEAVILY FOULED.
# Heavily fouled = stones in a dense settled-fines matrix (matrix = fouling_dense).
#
#   python scripts/pipeline/generate_in_files.py \
#       test_output/three_layer_400mhz_heavily_fouled.in \
#       --layers-file examples/scenes/three_layer_400mhz_heavily_fouled.toml --render

[sim]
title             = "400 MHz 3-layer mbubia — heavily fouled"
freq_hz           = 400e6
domain_x          = 1.0
antenna_clearance = 0.5
air_buffer        = 0.1
rx_spacing        = 0.0
seed              = 42

[scenario]
target_fouling    = "heavily_fouled"
target_eps        = 6.5
target_sigma      = 0.010

[[layer]]
name = "subgrade"             # eps=8
thickness = 0.20

[[layer]]
name = "formation"            # eps=10
thickness = 0.10

[[layer]]
name = "ballast"              # mbubia-packed rocks (eps=4) ...
thickness = 0.25
packed = true
matrix = "fouling_dense"      # ... in dense fines (eps=6.5, fully fouled dry)
