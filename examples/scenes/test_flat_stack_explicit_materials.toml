# TEST CONFIG — multi-layer flat stack with EXPLICIT (eps, sigma) materials.
# No packed layer → fully deterministic and fast; exercises the explicit-material
# path (eps/sigma fields) instead of the named registry.
#
#   python scripts/pipeline/generate_in_files.py test_output/flat_stack.in \
#       --layers-file examples/scenes/test_flat_stack_explicit_materials.toml

[sim]
title             = "TEST flat stack explicit materials"
freq_hz           = 400e6
domain_x          = 1.0
antenna_clearance = 0.4
air_buffer        = 0.1
rx_spacing        = 0.0
seed              = 7

# bottom -> top
[[layer]]
name = "wet_clay"                # not in the named registry: explicit material
thickness = 0.25
eps = 15.0
sigma = 0.08

[[layer]]
name = "dry_sand"
thickness = 0.15
eps = 4.5
sigma = 0.002

[[layer]]
name = "gravel_cap"
thickness = 0.10
eps = 6.0
sigma = 0.01
