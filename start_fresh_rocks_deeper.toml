# 420 MHz Ballast with HIGH-EPSILON ROCKS - DEEPER MODEL (100 ns)
[job]
render = true

[sim]
freq_hz = 420e6
domain_x = 0.5
dx = 0.003
antenna_clearance = 0.3
air_buffer = 0.0
time_window = 1.0e-7
antenna_mode = "bistatic"
num_receivers = 1
receiver_spacing = 0.03
title = "420 MHz Ballast with High-Eps Rocks (100ns, Deeper)"

[source]
waveform = "gaussian"
amplitude = 0.3
polarization = "z"

# Ballast with rocks: high epsilon rocks generate scattering
[[layer]]
name = "ballast"
thickness = 0.6
packed = true
rock_packing_algorithm = "mbubia"
rock_diameter = 0.025
rock_porosity = 0.35
eps = 7.5
sigma = 0.0
