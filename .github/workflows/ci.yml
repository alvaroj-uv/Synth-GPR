name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SDL_VIDEODRIVER: dummy   # headless pygame (pymunk packing)
      MPLBACKEND: Agg          # headless matplotlib
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Lint (soft — non-blocking)
        run: ruff check --output-format=github . || true

      - name: Tests (excluding gprMax-dependent)
        run: pytest -m "not gprmax" -q
