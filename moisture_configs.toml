# Moisture sweep configurations
# Test different sigma (conductivity) values to match real trace attenuation
# Real trace decay: -0.0632 dB/ns in first 7ns

[[scenarios]]
name = "moisture_sigma_0e00"
freq_hz = 420e6
domain_x = 0.5
dx = 0.003
antenna_clearance = 0.3
time_window = 5.0e-8
amplitude = 0.3

[scenarios.ballast]
thickness = 0.3
rock_packing_algorithm = "mbubia"
rock_diameter = 0.025
rock_porosity = 0.50
eps = 7.5
sigma = 0.0

