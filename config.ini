# ============================================================
# Synth-GPR Master Configuration
# ============================================================
# This file contains ALL configurable parameters for the
# synthetic GPR data generation pipeline.
#
# Usage:
#   python scripts/main/generate_dataset.py config.ini
#   python scripts/main/run_simulations.py config.ini
#
# Copy this file and modify for your specific needs.
# ============================================================

# ------------------------------------------------------------
# SIMULATION DOMAIN
# ------------------------------------------------------------
[simulation]
# Domain size (meters)
domain_x = 0.5          # Width (cross-track)
domain_y = 1.5          # Height (depth)
domain_z = 0.005        # Thickness (2D approximation)

# Grid resolution (meters) - smaller = more accurate but slower
dx = 0.005
dy = 0.005
dz = 0.005

# Time window (seconds)
time_window = 1.5e-8

# ------------------------------------------------------------
# ANTENNA CONFIGURATION
# ------------------------------------------------------------
[antenna]
# Center frequency (Hz)
# Common values: 400MHz (4e8), 900MHz (9e8), 1.5GHz (1.5e9), 2GHz (2e9)
center_freq = 1.5e9

# Transmitter/Receiver positions (meters)
tx_x = 0.300            # TX horizontal position
rx_x = 0.350            # RX horizontal position (offset = 0.05m)
tx_rx_y = 1.28          # Height of antennas (from bottom)
tx_rx_z = 0.0025        # Z position (centered in domain_z)

# Waveform and source options
add_waveform = true
add_source = true
add_geometry_view = false

# ------------------------------------------------------------
# BALLAST LAYER
# ------------------------------------------------------------
[ballast]
# Ballast thickness range (meters)
min_ballast_thickness = 0.25
max_ballast_thickness = 0.45

# Rock size range (meters) - radius
rock_radius_min = 0.02   # 20mm minimum
rock_radius_max = 0.032  # 32mm maximum (European standard: 22.4-63mm)

# Fouling thickness range (meters)
min_foul_thickness = 0.00
max_foul_thickness = 0.10

# ------------------------------------------------------------
# LAYER THICKNESSES
# ------------------------------------------------------------
[layers]
formation_thickness = 0.10   # Formation layer below ballast
subgrade_thickness = 0.20    # Bottom subgrade layer

# ------------------------------------------------------------
# MATERIAL PROPERTIES
# ------------------------------------------------------------
[materials]
# Dielectric properties: eps = relative permittivity, sigma = conductivity (S/m)

# Clean ballast rock (granite/basite)
bal_rock_eps = 5.0
bal_rock_sigma = 0.001

# Fouling material (fine particles, clay, water)
bal_foul_eps_min = 6.0
bal_foul_eps_max = 8.0
bal_foul_sigma_min = 0.002
bal_foul_sigma_max = 0.01

# Water pockets (high permittivity)
pocket_eps_min = 7.0
pocket_eps_max = 10.0
pocket_sigma_min = 0.005
pocket_sigma_max = 0.03

# Wet fouling amplification factors
wet_eps_factor_min = 1.2
wet_eps_factor_max = 1.8
wet_sigma_factor_min = 1.5
wet_sigma_factor_max = 3.0

# ------------------------------------------------------------
# GRANULAR MODE (Realistic Rock Placement)
# ------------------------------------------------------------
[Granular]
# Enable granular (individual rock) mode
granular_mode = true

# Percent Void Contamination (PVC) range
# CL: 0-5%, MC: 5-20%, MF: 20-40%, F: 40-60%, HF: 60-100%
pvc_min = 0.0
pvc_max = 100.0

# Max water pockets (when not in granular mode)
max_pockets = 4

# ------------------------------------------------------------
# MOISTURE SETTINGS
# ------------------------------------------------------------
[Moisture]
moisture_min = 0.0       # Minimum volumetric water content
moisture_max = 0.30      # Maximum volumetric water content (30%)
fractal_dimension = 1.5  # Fractal dimension for moisture distribution

# ------------------------------------------------------------
# VERTICAL GRADIENT (Fouling Distribution)
# ------------------------------------------------------------
[VerticalGradient]
grad_min_layers = 2      # Minimum number of gradient layers
grad_max_layers = 5      # Maximum number of gradient layers

# ------------------------------------------------------------
# DOMAIN RANDOMIZATION (For ML Robustness)
# ------------------------------------------------------------
[domain_randomization]
# Enable/disable all domain randomization
enable_domain_randomization = false

# Material property variation (±percentage)
soil_eps_variation = 0.2      # ±20% variation in soil permittivity
soil_sigma_variation = 0.5    # ±50% variation in soil conductivity
rock_eps_variation = 0.1      # ±10% variation in rock permittivity
rock_sigma_variation = 0.5    # ±50% variation in rock conductivity

# Moisture randomization
moisture_randomization_range = 0.15  # 0-15% volumetric water content

# Spatial jitter for rock positions
spatial_jitter_sigma = 0.02   # 2cm standard deviation (Gaussian)

# Post-processing noise injection
add_noise = false
noise_snr_min = 20.0          # Minimum SNR in dB (more noise)
noise_snr_max = 40.0          # Maximum SNR in dB (less noise)

# ------------------------------------------------------------
# WORKFLOW PARAMETERS
# ------------------------------------------------------------
[workflow]
# Dataset generation
output_dir = d:/Codigo/Synth-Data/Output
labels = CL,MC,MF,F           # Fouling classes to generate
samples_per_label = 10        # Samples per class
start_id = 0                  # Starting sample ID

# Batch simulation
num_jobs = 4                  # Parallel simulation jobs
gpu_devices =                 # GPU IDs (comma-separated, empty = CPU)

# Feature extraction
feature_output_csv = features.csv

# Visualization
show_plot = false
output_dpi = 150

# ------------------------------------------------------------
# RANDOM SEED (For Reproducibility)
# ------------------------------------------------------------
[Seed]
# Set a fixed seed for reproducible results (leave empty for random)
base_seed = 
